<style>
/* Layout: phone-first single column — header, money summary, sorting bins, search, product cards, input history; two floating actions. Indigo ink on cool paper. */
:root{

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --retail:#f28aa9; --retail-soft:#3d1c28; --early:#a3a7c2; --early-soft:#2a2c46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121428; --surface:#1c1e38; --ink:#eceef8; --muted:#a3a7c2; --line:#2e3256; --accent:#929dff; --accent-soft:#272b55; --chalk:#f2c94c; --chalk-ink:#2b2000;
  --re:#5ed3a2; --re-soft:#163a2d; --watch:#9aa4ff; --watch-soft:#272b55; --sale:#f2b45c; --sale-soft:#3b2b13;

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}

.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}

.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;box-sizing:border-box}

.month{width:auto;font-weight:600}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.money{background:var(--accent);color:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.money .lbl{font-size:12px;opacity:.85}
.money .big{font-family:var(--display);font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.c-re{--c:var(--re);--cs:var(--re-soft)} .c-watch{--c:var(--watch);--cs:var(--watch-soft)}
.c-sale{--c:var(--sale);--cs:var(--sale-soft)} .c-retail{--c:var(--retail);--cs:var(--retail-soft)} .c-early{--c:var(--early);--cs:var(--early-soft)}

.list{display:flex;flex-direction:column;gap:10px}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:15.5px;min-width:0}

.cthumb{border:0;padding:0;background:none;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;align-self:flex-start}

.tthumb{width:28px;height:28px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-right:6px}

.found{overflow:hidden}
.phrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

.pthumb.big{width:96px;height:96px}
.qe{display:block;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;border-radius:8px}
.qe:active{background:var(--accent-soft)}

.btn.sl{background:var(--sale-soft);color:var(--sale)}
.decl{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45}
.decl input{width:auto;margin-top:2px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.moneyd{border-radius:14px;background:var(--accent);color:var(--surface)}
.moneyd>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px}
.moneyd>summary::-webkit-details-marker{display:none}
.moneyd>summary b{font-size:15px;font-variant-numeric:tabular-nums}
.moneyd>summary .more{margin-left:auto;font-size:12px;opacity:.85}

.moneyd .money{padding-top:0;background:none}
.negt{color:#ffd0dc}
.histd>summary{cursor:pointer;font-family:var(--display);font-size:19px;padding:4px 0}
.histd .hist{margin-top:8px}
.vseg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}

.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.tile{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);border-radius:12px;overflow:hidden;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;min-width:0}

.tinfo{display:flex;flex-direction:column;padding:5px 7px 7px;gap:1px;min-width:0}

.tnm{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:14px}

.tst b{color:var(--ink);font-size:13px}
.cthumb.add{display:grid;place-items:center;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;text-align:center;line-height:1.2}
.szrow{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}

.tsz i{font-style:normal;font-size:10.5px;background:var(--bg);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.tsz i.z{background:var(--retail-soft);color:var(--retail)}
.sztbl{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.sztbl b{color:var(--ink);font-size:14px}
.sztbl input{padding:7px 8px}
.szst{min-width:36px;text-align:right;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.szline>summary{cursor:pointer;font-size:12.5px;color:var(--accent);font-weight:600}
.szin{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.szin label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted);font-weight:700}
.szin input{padding:7px 6px}
.sh{font-size:14px;margin:6px 0 0;color:var(--ink)}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 11px;font-size:13px}
.kinds button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.chrow{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.chrow .seg{flex:1}
.rline.in .chrow{display:none}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th,.tbl td{padding:8px 9px;text-align:right;border-bottom:1px solid var(--line)}
.tbl th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
.tbl td.l,.tbl th.l{text-align:left}
.tbl td.code-c{position:sticky;left:0;background:var(--surface);font-weight:700}
.tbl th.code-c{position:sticky;left:0;z-index:1}
.tbl tr[data-edit]{cursor:pointer}
.tbl tr[data-edit]:active td{background:var(--accent-soft)}
.tbl tfoot td{font-weight:700;background:var(--bg);border-bottom:0}
.tbl .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}
.nums.money2 b{overflow-wrap:normal;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.advice{font-size:13.5px;background:var(--cs);border-radius:8px;padding:8px 10px}
.advice b{color:var(--c)}
.warn-t{color:var(--retail);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:600;background:var(--accent);color:var(--surface)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--retail-soft);color:var(--retail)}
.btn.full{width:100%}
.btn.sm{font-size:12.5px;padding:5px 10px}
.fabs{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--surface);color:var(--accent);box-shadow:0 6px 16px rgba(20,24,70,.2);display:flex;align-items:center;gap:8px}
.fab.main{background:var(--accent);color:var(--surface);padding:15px 20px;font-size:15.5px}
.fab svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:12px;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.status.warn{color:var(--sale)}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.hrow .w{min-width:0}
.hrow .w b{display:block;font-size:13.5px}
.hrow.undone{opacity:.55}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,12,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;box-sizing:border-box;
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{font-size:12.5px;color:var(--retail);margin:0}
.rules{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}

.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg.two-way{grid-template-columns:1fr 1fr}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:8px 4px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg.two-way button[data-t="sale"][aria-pressed="true"]{background:var(--sale);color:var(--surface)}
.seg.two-way button[data-t="in"][aria-pressed="true"]{background:var(--re);color:var(--surface)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.pick{cursor:pointer;-webkit-tap-highlight-color:transparent;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.pick svg{width:26px;height:26px}
.pick.on{background:var(--retail-soft);color:var(--retail);border-color:var(--retail)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;padding:0}

.caph{font-size:13px;font-weight:700;color:var(--muted)}
.lnhead{display:flex;gap:8px;align-items:flex-end}
.found{display:flex;flex-direction:column;font-size:14px}
.newp{display:flex;flex-direction:column;gap:8px}
.qtyrow{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="h1"></h1><p id="sub"></p></div>
    <div class="ctrl">
      <div class="lang" role="group" aria-label="언어 / Idioma"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="pt">Português</button></div>
      <select class="month" id="month" aria-label="month"></select>
    </div>
  </div>
  <details class="moneyd" id="moneyd"><summary id="moneySum"></summary><div class="money" id="money"></div></details>

async function saveItem(id,data){
  if(db){try{const ref=id?db.collection('styles').doc(id):db.collection('styles').doc();await ref.set(data);return ref.id}catch(e){toast(t().tSaveErr);return null}}
  if(id){const k=items.findIndex(x=>x.id===id);items[k]={...data,id};render();return id}

}
async function patchItem(id,patch){
  if(db){await db.collection('styles').doc(id).update(patch);return}

async function removeItem(id){

      if(l.created){if(db)await db.collection('styles').doc(l.id).delete();else items=items.filter(x=>x.id!==l.id);delete patches[l.id];continue}
      const p=patches[l.id]||(patches[l.id]={made:+it.made||0,sold:+it.sold||0,soldV:+it.soldV||0,sz:JSON.parse(JSON.stringify(it.sz||{}))});
      if(szSum(l.sz))p.sz=addSz(p.sz,l.sz,l.type==='in'?'m':'s',-1);
      if(l.type==='in')p.made=Math.max(0,p.made-l.qty);else{p.sold=Math.max(0,p.sold-l.qty);if(l.ch==='V')p.soldV=Math.max(0,p.soldV-l.qty)}}
    for(const [id,p] of Object.entries(patches)){if(p.sold>p.made)p.sold=p.made;if(p.soldV>p.sold)p.soldV=p.sold;await patchItem(id,{...p,updatedAt:new Date().toISOString()})}
    if(db)await db.collection('moves').doc(m.id).update({undone:true});else{m.undone=true}
    render();toast(L.tUndone)}catch(e){toast(L.tSaveErr)}
}

document.addEventListener('change',async e=>{const el=e.target.closest&&e.target.closest('input[data-cph]');if(!el)return;const f=el.files&&el.files[0];if(!f)return;
  try{const ph=await makeThumb(f);await patchItem(el.dataset.cph,{photo:ph,updatedAt:new Date().toISOString()});const it=items.find(i=>i.id===el.dataset.cph);
    if(it&&document.querySelector('.sheet .card'))openSheet(`${head(esc(lbl(it)))}${card({...it,j:calc(it)})}`);toast(t().tSaved)}catch(_){toast(t().phErr)}});
document.addEventListener('click',e=>{const tr=e.target.closest('tr[data-edit]');if(tr){const it=items.find(i=>i.id===tr.dataset.edit);if(it)itemForm(it);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.qe){const it=items.find(i=>i.id===b.dataset.qe);if(it)quickEdit(it);return}
  if(b.dataset.sl){const it=items.find(i=>i.id===b.dataset.sl);if(it)slForm(it);return}
  if(b.dataset.view){const it=items.find(i=>i.id===b.dataset.view);if(it)photoView(it.photo);return}
  if(b.dataset.vm){view=b.dataset.vm;try{localStorage.setItem('view2',view)}catch(e){}render();return}
  if(b.dataset.open){const it=items.find(i=>i.id===b.dataset.open);if(it)openSheet(`${head(esc(lbl(it)))}${card({...it,j:calc(it)})}`);return}
  if(b.dataset.lang){lang=b.dataset.lang;try{localStorage.setItem('lang',lang)}catch(e){}closeSheet();render()}
  if(b.dataset.f&&b.classList.contains('bin')||b.dataset.f==='all'&&!b.closest('.sheet')){filter=filter===b.dataset.f?'all':b.dataset.f;q='';$('#q').value='';render()}
  if(b.dataset.in){const it=items.find(i=>i.id===b.dataset.in);if(it)inputForm({code:it.ref||'',pick:it.id,type:'sale'})}
  if(b.dataset.edit)itemForm(items.find(i=>i.id===b.dataset.edit));
  if(b.dataset.undo){if(b.dataset.armed){const m=moves.find(x=>x.id===b.dataset.undo);if(m)undoMove(m)}else{b.dataset.armed='1';b.textContent=t().hUndoQ;b.classList.replace('soft','danger');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=t().hUndo;b.classList.replace('danger','soft')}},4000)}}
  if(b.id==='rcBtn')inputForm();
  if(b.id==='rulesBtn'||b.id==='bizPick')rulesForm();
});
$('#month').addEventListener('change',e=>{month=e.target.value;filter='all';render()});
let qt;$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{q=e.target.value.trim();render()},150)});

// ---------- hooks used by the storage / AI layer ----------
window.App={
  attach(d){this.detach();db=d;items=[];moves=[];loaded=false;let first=true;
    unsub.push(db.collection('styles').onSnapshot(snap=>{items=snap.docs.map(x=>({id:x.id,...x.data()}));loaded=true;if(dbState==='wait'||dbState==='err')dbState='ok';
      if(first){first=false;if(items.length&&!items.some(i=>i.month===month))month=monthsList().find(m=>items.some(i=>i.month===m))||month}
      render()},()=>{dbState='err';loaded=true;render()}));
    unsub.push(db.doc('config/rules').onSnapshot(s=>{if(s.exists){rules={...DEF,...s.data()};render()}},()=>{}));
    unsub.push(db.collection('moves').orderBy('at','desc').limit(8).onSnapshot(snap=>{moves=snap.docs.map(x=>({id:x.id,...x.data()}));renderHist()},()=>{}));
    render()},
  detach(){unsub.forEach(f=>{try{f()}catch(e){}});unsub=[];db=null},
  setAi(fn,opts){ai=fn;aiOpts=opts||{images:null}},
  setState(s){dbState=s;if(s==='no'){loaded=true}render()},
  render
};
render();
</script>

<script src="firebase-config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getAI, getGenerativeModel, GoogleAIBackend } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";
import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";

const $ = s => document.querySelector(s);
const LG = {
  ko: { title: '재고 정리판', sub: '구글 계정으로 로그인하면 내 상품 정보가 안전하게 저장돼요.', btn: 'Google로 로그인', out: '로그아웃', err: '로그인하지 못했어요. 다시 눌러주세요.',
    suSub: '처음 한 번만 설정해요. Firebase에서 복사한 설정을 붙여넣으세요.', suCfgL: 'Firebase 설정 (const firebaseConfig = { ... } 전체를 붙여넣기)', suKeyL: '보안 키 (reCAPTCHA 키 ID, 없으면 비워두기)',
    suSave: '저장하고 시작하기', suLocal: 'Firebase 없이 이 휴대폰에서만 써보기', suLocalHint: '설정 없이 바로 써볼 수 있어요. 내용은 이 휴대폰에만 저장되고, 영수증 AI 읽기는 Firebase 설정 후에 쓸 수 있어요.',
    suErr: '설정을 읽지 못했어요. apiKey, projectId, appId가 들어 있는지 확인해 주세요.', setup: '앱 설정', local: '이 휴대폰에만 저장 중' },
  pt: { title: 'Controle de Estoque', sub: 'Entre com sua conta Google para guardar seus produtos com segurança.', btn: 'Entrar com Google', out: 'Sair', err: 'Não foi possível entrar. Tente de novo.',
    suSub: 'Configure só uma vez. Cole a configuração copiada do Firebase.', suCfgL: 'Configuração do Firebase (cole todo o const firebaseConfig = { ... })', suKeyL: 'Chave de segurança (ID da chave reCAPTCHA, opcional)',
    suSave: 'Salvar e começar', suLocal: 'Usar só neste celular, sem Firebase', suLocalHint: 'Dá para testar sem configurar. Os dados ficam só neste celular e a leitura de notas por IA funciona depois de configurar o Firebase.',
    suErr: 'Não consegui ler a configuração. Confira se tem apiKey, projectId e appId.', setup: 'Configurar app', local: 'Salvando só neste celular' }
};
let user = null, localMode = false;
const ls = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, del: k => { try { localStorage.removeItem(k) } catch (e) {} } };
const lg = () => LG[document.documentElement.lang === 'ko' ? 'ko' : 'pt'];
App.onRender = () => { const L = lg();
  $('#lgTitle').textContent = L.title; $('#lgSub').textContent = L.sub; $('#loginTxt').textContent = L.btn;
  $('#logoutBtn').textContent = L.out; $('#whoName').textContent = user ? (user.email || '') : (localMode ? L.local : '');
  $('#setupBtn').textContent = L.setup; $('#logoutBtn').hidden = !user;
  $('#suCfgL').textContent = L.suCfgL; $('#suKeyL').textContent = L.suKeyL; $('#suSave').textContent = L.suSave; $('#suLocal').textContent = L.suLocal; $('#suLocalHint').textContent = L.suLocalHint;
  if (!$('#setup').hidden) $('#lgSub').textContent = L.suSub; };
App.render();

const valid = c => c && c.apiKey && !String(c.apiKey).startsWith('PASTE') && c.projectId && c.appId;
let cfg = window.FIREBASE_CONFIG || {};
if (!valid(cfg)) { try { cfg = JSON.parse(ls.get('fbcfg') || '{}'); } catch (e) { cfg = {}; } }
const loginBox = $('#login'), err = $('#lgErr');
$('#setupBtn').onclick = () => { ls.del('fbcfg'); ls.del('localMode'); location.reload(); };
function parseCfg(text) {
  const o = {}; const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g; let m;
  while ((m = re.exec(text))) o[m[1]] = m[2];
  if (o.projectId && !o.authDomain) o.authDomain = o.projectId + '.firebaseapp.com';
  return o;
}
function localDb() {
  let store = {}; try { store = JSON.parse(ls.get('jaego-local') || '{}'); } catch (e) {}
  const subs = new Set(); const save = () => ls.set('jaego-local', JSON.stringify(store));
  const fire = () => subs.forEach(f => f()); let seq = 0;
  const kids = p => Object.keys(store).filter(k => k.startsWith(p + '/') && k.split('/').length === p.split('/').length + 1)
    .map(k => ({ id: k.split('/').pop(), data: () => JSON.parse(JSON.stringify(store[k])) }));
  const q = (p, ord, lim) => ({ onSnapshot(n) { const f = () => { let d = kids(p); if (ord) d.sort((a, b) => String(b.data()[ord]).localeCompare(String(a.data()[ord]))); if (lim) d = d.slice(0, lim); n({ docs: d }); }; subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    limit(n) { return q(p, ord, n); } });
  const dref = path => ({ id: path.split('/').pop(),
    async set(d) { store[path] = JSON.parse(JSON.stringify(d)); save(); fire(); },
    async update(d) { if (!store[path]) throw new Error('missing'); Object.assign(store[path], JSON.parse(JSON.stringify(d))); save(); fire(); },
    async delete() { delete store[path]; save(); fire(); },
    onSnapshot(n) { const f = () => n({ exists: !!store[path], data: () => store[path] }); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); } });
  return { collection: p => Object.assign(q(p), { orderBy: f => q(p, f), doc: id => dref(p + '/' + (id || ('l' + Date.now().toString(36) + (seq++)))) }), doc: dref };
}
if (!valid(cfg) && ls.get('localMode') === '1') {
  localMode = true; App.attach(localDb()); App.setState('ok');
} else if (!valid(cfg)) {
  loginBox.hidden = false; $('#loginBtn').hidden = true; $('#setup').hidden = false; App.render();
  $('#suSave').onclick = () => { const o = parseCfg($('#cfgText').value); const k = $('#cfgKey').value.trim(); if (k) o.appCheckSiteKey = k;
    if (!valid(o)) { $('#suErr').textContent = lg().suErr; $('#suErr').hidden = false; return; }
    ls.set('fbcfg', JSON.stringify(o)); ls.del('localMode'); location.reload(); };
  $('#suLocal').onclick = () => { ls.set('localMode', '1'); location.reload(); };
} else {
  const app = initializeApp(cfg);
  const siteKey = cfg.appCheckSiteKey;
  if (siteKey && !String(siteKey).startsWith('PASTE')) {
    try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider(siteKey), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn('App Check', e); }
  }
  const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const auth = getAuth(app);

  // --- storage adapter (same shape the shared page code expects) ---
  const w = p => navigator.onLine ? Promise.race([p, new Promise(r => setTimeout(r, 4000))]) : (p.catch(() => {}), Promise.resolve());
  const docRef = r => ({ id: r.id, set: d => w(setDoc(r, d)), update: d => w(updateDoc(r, d)), delete: () => w(deleteDoc(r)),
    onSnapshot: (n, e) => onSnapshot(r, s => n({ exists: s.exists(), data: () => s.data() }), e) });
  const qRef = q => ({ onSnapshot: (n, e) => onSnapshot(q, s => n({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }), e) });
  const colRef = c => Object.assign(qRef(c), {
    doc: id => docRef(id ? doc(c, id) : doc(c)),
    orderBy: (f, dir) => Object.assign(qRef(query(c, orderBy(f, dir))), { limit: n => qRef(query(c, orderBy(f, dir), limit(n))) })
  });
  const makeDb = uid => ({ collection: p => colRef(collection(fs, `users/${uid}/${p}`)), doc: p => docRef(doc(fs, `users/${uid}/${p}`)) });

  // --- AI: Gemini through Firebase AI Logic ---
  try {
    const ai = getAI(app, { backend: new GoogleAIBackend() });
    const model = getGenerativeModel(ai, { model: cfg.aiModel || 'gemini-3.5-flash', generationConfig: { responseMimeType: 'application/json', temperature: 0.1 } });
    const b64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
    App.setAi(async (prompt, imgs) => {
      const parts = [{ text: prompt }];
      for (const b of imgs || []) parts.push({ inlineData: { data: await b64(b), mimeType: b.type || 'image/jpeg' } });
      const r = await model.generateContent(parts);
      const txt = r.response.text().trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '');
      return JSON.parse(txt);
    }, { images: { maxCount: 4 } });
  } catch (e) { console.warn('AI', e); }

  // --- sign-in ---
  const provider = new GoogleAuthProvider();
  $('#loginBtn').onclick = async () => { err.hidden = true;
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
        try { await signInWithRedirect(auth, provider); } catch (e2) { err.textContent = lg().err; err.hidden = false; }
      } else if (e.code !== 'auth/popup-closed-by-user') { err.textContent = lg().err; err.hidden = false; }
    } };
  getRedirectResult(auth).catch(() => {});
  $('#logoutBtn').onclick = () => signOut(auth);
  onAuthStateChanged(auth, u => {
    user = u;
    if (!u) { App.detach(); loginBox.hidden = false; App.setState('wait'); return; }
    loginBox.hidden = true; App.attach(makeDb(u.uid)); App.setState(navigator.onLine ? 'wait' : 'off');
  });
  addEventListener('offline', () => user && App.setState('off'));
  addEventListener('online', () => user && App.setState('ok'));
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
