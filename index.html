<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>재고 정리판 · Controle de Estoque</title>
<meta name="description" content="옷 상품 코드·입고·판매·재고·수익 관리 / Controle de código, entrada, vendas, estoque e lucro de roupas">
<meta name="theme-color" content="#33408f">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
/* Layout: phone-first single column — header, money summary, sorting bins, search, product cards, input history; two floating actions. Indigo ink on cool paper. */
:root{
  --bg:#f1f0f6; --surface:#ffffff; --ink:#1d1f36; --muted:#666a85; --line:#dddfea;
  --accent:#33408f; --accent-soft:#e5e7f5; --chalk:#f2c94c; --chalk-ink:#4a3700;
  --re:#16805a; --re-soft:#dcf2e7; --watch:#4a56a8; --watch-soft:#e5e7f5;
  --sale:#b26300; --sale-soft:#fcecd4; --retail:#b8325a; --retail-soft:#f9dfe7; --early:#7a7f98; --early-soft:#ececf2;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121428; --surface:#1c1e38; --ink:#eceef8; --muted:#a3a7c2; --line:#2e3256; --accent:#929dff; --accent-soft:#272b55; --chalk:#f2c94c; --chalk-ink:#2b2000;
  --re:#5ed3a2; --re-soft:#163a2d; --watch:#9aa4ff; --watch-soft:#272b55; --sale:#f2b45c; --sale-soft:#3b2b13;
  --retail:#f28aa9; --retail-soft:#3d1c28; --early:#a3a7c2; --early-soft:#2a2c46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121428; --surface:#1c1e38; --ink:#eceef8; --muted:#a3a7c2; --line:#2e3256; --accent:#929dff; --accent-soft:#272b55; --chalk:#f2c94c; --chalk-ink:#2b2000;
  --re:#5ed3a2; --re-soft:#163a2d; --watch:#9aa4ff; --watch-soft:#272b55; --sale:#f2b45c; --sale-soft:#3b2b13;
  --retail:#f28aa9; --retail-soft:#3d1c28; --early:#a3a7c2; --early-soft:#2a2c46; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.15}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);padding:6px 12px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
.month{width:auto;font-weight:600}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.money{background:var(--accent);color:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.money .lbl{font-size:12px;opacity:.85}
.money .big{font-family:var(--display);font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;min-width:0}
.mgrid b{display:block;font-size:16px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.money .note{font-size:11.5px;opacity:.85;margin:0}
.neg{color:#ffd0dc}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.bin{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--c)}
.bin[aria-pressed="true"]{background:var(--cs);border-color:var(--c)}
.bin .n{font-family:var(--display);font-size:28px;line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.bin .t{font-weight:700;font-size:14px}
.bin .d{font-size:11.5px;color:var(--muted)}
.c-re{--c:var(--re);--cs:var(--re-soft)} .c-watch{--c:var(--watch);--cs:var(--watch-soft)}
.c-sale{--c:var(--sale);--cs:var(--sale-soft)} .c-retail{--c:var(--retail);--cs:var(--retail-soft)} .c-early{--c:var(--early);--cs:var(--early-soft)}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{padding-left:36px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.name{font-weight:700;font-size:15.5px;min-width:0}
.code.big{font-size:17px;padding:2px 9px;margin-right:8px;vertical-align:0}
.pname{font-weight:500;font-size:14px}
.code{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;background:var(--chalk);color:var(--chalk-ink);padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:1px}
.ref{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cs);color:var(--c);white-space:nowrap}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12px;color:var(--muted)}
.nums b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.nums.money2{grid-template-columns:1fr 1fr}
.nums.money2 b{overflow-wrap:normal;white-space:nowrap}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.advice{font-size:13.5px;background:var(--cs);border-radius:8px;padding:8px 10px}
.advice b{color:var(--c)}
.warn-t{color:var(--retail);font-weight:600}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:600;background:var(--accent);color:var(--surface)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--retail-soft);color:var(--retail)}
.btn.full{width:100%}
.btn.sm{font-size:12.5px;padding:5px 10px}
.fabs{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--surface);color:var(--accent);box-shadow:0 6px 16px rgba(20,24,70,.2);display:flex;align-items:center;gap:8px}
.fab.main{background:var(--accent);color:var(--surface);padding:15px 20px;font-size:15.5px}
.fab svg{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1.5px dashed var(--line);border-radius:12px;font-size:14px}
.status{font-size:12px;color:var(--muted)}
.status.warn{color:var(--sale)}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px}
.hrow .w{min-width:0}
.hrow .w b{display:block;font-size:13.5px}
.hrow.undone{opacity:.55}
.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,12,35,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;box-sizing:border-box;
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{font-size:12.5px;color:var(--retail);margin:0}
.rules{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.rules b{color:var(--ink)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg.two-way{grid-template-columns:1fr 1fr}
.seg button{border:0;background:var(--surface);color:var(--muted);padding:8px 4px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.seg.two-way button[data-t="sale"][aria-pressed="true"]{background:var(--sale);color:var(--surface)}
.seg.two-way button[data-t="in"][aria-pressed="true"]{background:var(--re);color:var(--surface)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0);pointer-events:none}
.pick{cursor:pointer;-webkit-tap-highlight-color:transparent;border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:14px 8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px}
.pick svg{width:26px;height:26px}
.pick.on{background:var(--retail-soft);color:var(--retail);border-color:var(--retail)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;border:0;border-radius:999px;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;padding:0}
.rline{border:1px solid var(--line);border-left:5px solid var(--lc,var(--line));border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rline.sale{--lc:var(--sale)} .rline.in{--lc:var(--re)} .rline.skip{opacity:.5}
.read{font-size:12px;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.cap{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.caph{font-size:13px;font-weight:700;color:var(--muted)}
.lnhead{display:flex;gap:8px;align-items:flex-end}
.found{display:flex;flex-direction:column;font-size:14px}
.newp{display:flex;flex-direction:column;gap:8px}
.qtyrow{display:grid;grid-template-columns:1fr 96px;gap:8px;align-items:center}
.busy{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;padding:6px 0}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;max-width:86%;text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(28px);opacity:.6}}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.login .box{max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.login img{width:96px;height:96px;border-radius:22px}
.login p{color:var(--muted);margin:0}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:13px;font-weight:700}
.who{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="h1"></h1><p id="sub"></p></div>
    <div class="ctrl">
      <div class="lang" role="group" aria-label="언어 / Idioma"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="pt">Português</button></div>
      <select class="month" id="month" aria-label="month"></select>
    </div>
  </div>
  <div class="money" id="money"></div>
  <div class="bins" id="bins"></div>
  <div class="sum" id="sum"></div>
  <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></div>
  <div class="row"><h2 id="listTitle"></h2><button class="btn soft" type="button" id="rulesBtn"></button></div>
  <div class="list" id="list"></div>
  <div class="row" id="histHead"><h2 id="histTitle"></h2></div>
  <div class="hist" id="hist"></div>
  <div class="status" id="status"></div>
  <div class="who"><span id="whoName"></span><span><button class="linkbtn" type="button" id="setupBtn"></button> · <button class="linkbtn" type="button" id="logoutBtn"></button></span></div>
</div>
<div class="fabs">
  <button class="fab main" type="button" id="rcBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span id="rcBtnTxt"></span></button>
</div>
<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=n=>Number(n||0).toLocaleString('pt-BR');
const norm=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').normalize('NFC').replace(/[^0-9a-z가-힣]/g,'');
const normCode=s=>norm(s).replace(/^(ref|codigo|cod|코드)/,'');
const dn=i=>i?(lang==='pt'?(i.namePt||i.name||''):(i.name||i.namePt||'')):'';
const lbl=i=>i?[i.ref,dn(i)].filter(Boolean).join(' · '):'';
const hasHangul=s=>/[\uac00-\ud7a3]/.test(String(s||''));

const T={
ko:{h1:'재고 정리판',sub:'생산한 옷의 판매·재고·수익을 한눈에',monthL:(y,m)=>`${y}년 ${m}월 생산`,
 sales:'이번 달 매출',salesNote:'판매 수량 × 판매가',profit:'판매 이익',profitNote:'판매한 옷에서 남은 돈 (판매가 − 원가)',
 prodCost:'생산비 총액',cash:'현금 수익',cashNote:'매출 − 생산비 (안 팔린 재고까지 뺀 금액)',stockVal:'남은 재고 가치',margin:'이익률',
 noCost:'원가가 없는 옷은 수익 계산에서 빠져요.',
 cats:{re:['재판','다시 만들 옷'],watch:['지켜보기','계속 판매'],sale:['사우드','saldão 세일'],retail:['소매 처리','소매로 남은 재고 정리'],early:['판단 이름','생산 후 기간 짧음']},
 styles:'상품',made:'입고',sold:'판매',stock:'재고',pcs:'장',rate:'판매율',all:'전체 상품',catList:t=>`${t} 상품`,showAll:'전체 보기',
 qPh:'코드나 이름으로 찾기',searchRes:n=>`찾은 상품 ${n}개`,noFound:'찾는 상품이 없어요. 입력하기에서 코드를 넣으면 새로 등록돼요.',
 rulesBtn:'분류 기준',add:'+ 상품 등록',rcBtn:'영수증·말로 입력',noCode:'코드 없음',day:d=>`입고 ${d}일째`,noDate:'날짜 없음',
 costL:'원가',priceL:'판매가',unitProfit:'장당 이익',itemSales:'매출',itemProfit:'이익',
 adRe:(pd,q)=>`<b>재판 추천</b> · 하루 약 ${pd}장씩 팔려요. <b>${q}장</b> 정도 다시 만들면 좋아요.`,
 adWatch:r=>`<b>계속 판매</b> · 판매율 ${r}%. 매장 앞쪽 진열이나 SNS 홍보로 더 밀어보세요.`,
 adSale:(s,p,o)=>`<b>사우드 추천</b> · 재고 ${s}장.`+(p?` 판매가 ${p[0]} → <b>${p[1]}</b> (${o}% 할인)로 saldão에 내보세요.`:' saldão에 내보세요.'),
 belowCost:c=>` <span class="warn-t">할인가가 원가(${c})보다 낮아요.</span>`,
 adRetail:s=>`<b>소매 처리</b> · 남은 ${s}장은 도매로 팔기엔 적어요. 매장 소매, 인스타·틱톡샵으로 정리하세요.`,
 adEarly:(d,m)=>`<b>조금 더 지켜보세요</b> · 입고 ${d}일째예요. ${m}일이 지나면 분류해 드려요.`,
 adWait:'<b>입고 대기</b> · 아직 들어온 수량이 없어요. 입고 영수증을 찍으면 수량이 올라가요.',
 sellBtn:'판매 수량 입력',edit:'수정',close:'닫기',save:'저장',
 emptyMonth:m=>`${m} 상품이 아직 없어요.<br>오른쪽 아래 <b>입력하기</b>에서 코드를 넣으면 새 상품으로 등록돼요.`,emptyCat:'이 분류에 해당하는 상품이 없어요.',loading:'불러오는 중…',

let lang='ko'; try{lang=localStorage.getItem('lang')||'ko'}catch(e){}
const t=()=>T[lang];

const DEF={minDays:20,reRate:70,lowRate:40,retailMax:30,saleOff:30};
let rules={...DEF}, items=[], moves=[], db=null, ai=null, aiOpts={images:null}, filter='all', q='', loaded=false, dbState='wait', unsub=[];
let month=new Date().toISOString().slice(0,7);
const CLS={re:'c-re',watch:'c-watch',sale:'c-sale',retail:'c-retail',early:'c-early'};

function daysSince(d){if(!d)return 999;return Math.max(0,Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5))}
function calc(it){
  const made=+it.made||0, sold=Math.min(+it.sold||0,made), stock=made-sold, rate=made?sold/made*100:0, days=daysSince(it.madeDate);
  const price=+it.price||0, cost=+it.cost||0;
  let cat; if(!made)cat='early'; else if(rate>=rules.reRate)cat='re'; else if(days<rules.minDays)cat='early'; else if(rate>=rules.lowRate)cat='watch'; else cat=stock>rules.retailMax?'sale':'retail';
  return {made,sold,stock,rate,days,cat,price,cost,perDay:sold/Math.max(days,1),sales:sold*price,profit:cost?sold*(price-cost):null,prodCost:made*cost};
}
function advice(j){const L=t();
  if(!j.made)return L.adWait;
  if(j.cat==='re'){const need=Math.max(0,Math.round(j.perDay*30-j.stock));const qn=Math.max(need,Math.round(j.made*0.5/6)*6);return L.adRe(j.perDay.toFixed(1),qn)}
  if(j.cat==='watch')return L.adWatch(j.rate.toFixed(0));
  if(j.cat==='sale'){const sp=j.price*(1-rules.saleOff/100);let s=L.adSale(j.stock,j.price?[brl(j.price),brl(sp)]:null,rules.saleOff);if(j.price&&j.cost&&sp<j.cost)s+=L.belowCost(brl(j.cost));return s}
  if(j.cat==='retail')return L.adRetail(j.stock);
  return L.adEarly(j.days,rules.minDays);
}
function monthsList(){const s=new Set(items.map(i=>i.month).filter(Boolean));s.add(month);s.add(new Date().toISOString().slice(0,7));return [...s].sort().reverse()}
function mLabel(m){const [y,mm]=m.split('-');return t().monthL(y,+mm)}
const byRecent=(a,b)=>String(b.madeDate||'').localeCompare(String(a.madeDate||''));

function card(i){const L=t(),j=i.j;return `<div class="card ${CLS[j.cat]}">
    <div class="row"><div class="name"><span class="code big">${esc(i.ref||L.noCode)}</span>${dn(i)?`<span class="pname">${esc(dn(i))}</span>`:''}<div class="ref">${j.days===999?L.noDate:L.day(j.days)}${q?' · '+esc(mLabel(i.month||month)):''}</div></div><span class="pill">${L.cats[j.cat][0]}</span></div>
    <div class="nums"><div>${L.made}<b>${j.made}</b></div><div>${L.sold}<b>${j.sold}</b></div><div>${L.stock}<b>${j.stock}</b></div></div>
    <div class="bar" role="img" aria-label="${L.rate} ${j.rate.toFixed(0)}%"><i style="width:${j.rate.toFixed(1)}%"></i></div>
    <div class="ref">${L.rate} <b style="color:var(--ink)">${j.rate.toFixed(0)}%</b> · ${L.costL} ${j.cost?brl(j.cost):'—'} · ${L.priceL} ${j.price?brl(j.price):'—'}${j.cost&&j.price?' · '+L.unitProfit+' '+brl(j.price-j.cost):''}</div>
    <div class="nums money2"><div>${L.itemSales}<b>${brl(j.sales)}</b></div><div>${L.itemProfit}<b style="${j.profit<0?'color:var(--retail)':''}">${j.profit===null?'—':brl(j.profit)}</b></div></div>
    <div class="advice">${advice(j)}</div>
    <div class="acts"><button class="btn" type="button" data-in="${i.id}">${L.cardIn}</button><button class="btn soft" type="button" data-edit="${i.id}">${L.edit}</button></div>
  </div>`}

function render(){
  const L=t(); document.documentElement.lang=lang==='ko'?'ko':'pt-BR';
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $('#h1').textContent=L.h1; $('#sub').textContent=L.sub; $('#rulesBtn').textContent=L.rulesBtn; $('#rcBtnTxt').textContent=L.inBtn;
  $('#q').placeholder=L.qPh; $('#q').setAttribute('aria-label',L.qPh); $('#histTitle').textContent=L.hTitle;

function buildPrompt(text,nImg,kind){

  return `You read stock-movement records for a women's clothing wholesaler in Bom Retiro, São Paulo, Brazil. A record can be a photo of a sales receipt or order (pedido, nota, romaneio, cupom), a delivery slip from a sewing workshop (oficina, facção), a handwritten notebook page, or a sentence the owner typed or spoke, in Korean or Portuguese.

Products are identified by their code (código). Registered products (code | Korean name | Portuguese name, names may be empty):
${list||'(none yet)'}

Rules:

- "code": the product code (código, cód., REF, ref, 코드). Prefer the exact registered code it matches. Remove size or color suffixes such as "-P", "/M", " AZUL". If the record gives only a name, look up its code in the list above; if you cannot find it, use null.
- "name": the product name as written in the record, null if none.
- "qty": total pieces as an integer. Add up sizes or colors listed separately (P 2, M 4, G 4 = 10). Dozens (dz, dúzia, 다스) × 12.
- One entry per product; merge repeated lines of the same product and type.
- Do not invent lines. Skip totals, prices, taxes, payment and customer details.
- "read": a short quote of what you read for that line.

Return ONLY a JSON object, no other text:
{"lines":[{"code":"2611","name":"Vestido linho","qty":20,"type":"sale","read":"2611 vestido P4 M8 G8"}],"note":""}
"note": anything unclear, written in ${lang==='ko'?'Korean':'Portuguese'}; empty if nothing.
${nImg?`\n${nImg} photo(s) are attached.`:''}${text?`\nOwner's text or speech:\n"""${text}"""`:''}`;
}
function matchItem(l){

  return m;
}

  const colRef = c => Object.assign(qRef(c), {
    doc: id => docRef(id ? doc(c, id) : doc(c)),
    orderBy: (f, dir) => Object.assign(qRef(query(c, orderBy(f, dir))), { limit: n => qRef(query(c, orderBy(f, dir), limit(n))) })
  });
  const makeDb = uid => ({ collection: p => colRef(collection(fs, `users/${uid}/${p}`)), doc: p => docRef(doc(fs, `users/${uid}/${p}`)) });

  // --- AI: Gemini through Firebase AI Logic ---
  try {
    const ai = getAI(app, { backend: new GoogleAIBackend() });
    const model = getGenerativeModel(ai, { model: cfg.aiModel || 'gemini-3.5-flash', generationConfig: { responseMimeType: 'application/json', temperature: 0.1 } });
    const b64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
    App.setAi(async (prompt, imgs) => {
      const parts = [{ text: prompt }];
      for (const b of imgs || []) parts.push({ inlineData: { data: await b64(b), mimeType: b.type || 'image/jpeg' } });
      const r = await model.generateContent(parts);
      const txt = r.response.text().trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '');
      return JSON.parse(txt);
    }, { images: { maxCount: 4 } });
  } catch (e) { console.warn('AI', e); }

  // --- sign-in ---
  const provider = new GoogleAuthProvider();
  $('#loginBtn').onclick = async () => { err.hidden = true;
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
        try { await signInWithRedirect(auth, provider); } catch (e2) { err.textContent = lg().err; err.hidden = false; }
      } else if (e.code !== 'auth/popup-closed-by-user') { err.textContent = lg().err; err.hidden = false; }
    } };
  getRedirectResult(auth).catch(() => {});
  $('#logoutBtn').onclick = () => signOut(auth);
  onAuthStateChanged(auth, u => {
    user = u;
    if (!u) { App.detach(); loginBox.hidden = false; App.setState('wait'); return; }
    loginBox.hidden = true; App.attach(makeDb(u.uid)); App.setState(navigator.onLine ? 'wait' : 'off');
  });
  addEventListener('offline', () => user && App.setState('off'));
  addEventListener('online', () => user && App.setState('ok'));
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
