<style>
/* Layout: phone-first single column — header, money summary, sorting bins, search, product cards, input history; two floating actions. Indigo ink on cool paper. */
:root{

  --accent:#33408f; --accent-soft:#e5e7f5; --chalk:#f2c94c; --chalk-ink:#4a3700;
  --re:#16805a; --re-soft:#dcf2e7; --watch:#4a56a8; --watch-soft:#e5e7f5;
  --sale:#b26300; --sale-soft:#fcecd4; --retail:#b8325a; --retail-soft:#f9dfe7; --early:#7a7f98; --early-soft:#ececf2;
  --display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --re:#5ed3a2; --re-soft:#163a2d; --watch:#9aa4ff; --watch-soft:#272b55; --sale:#f2b45c; --sale-soft:#3b2b13;
  --retail:#f28aa9; --retail-soft:#3d1c28; --early:#a3a7c2; --early-soft:#2a2c46; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121428; --surface:#1c1e38; --ink:#eceef8; --muted:#a3a7c2; --line:#2e3256; --accent:#929dff; --accent-soft:#272b55; --chalk:#f2c94c; --chalk-ink:#2b2000;
  --re:#5ed3a2; --re-soft:#163a2d; --watch:#9aa4ff; --watch-soft:#272b55; --sale:#f2b45c; --sale-soft:#3b2b13;
  --retail:#f28aa9; --retail-soft:#3d1c28; --early:#a3a7c2; --early-soft:#2a2c46; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.15}
h2{font-family:var(--display);font-weight:400;font-size:21px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang button{border:0;background:none;color:var(--muted);padding:6px 12px;font-size:13px;font-weight:600}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:84px;resize:vertical}
.month{width:auto;font-weight:600}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.money{background:var(--accent);color:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.money .lbl{font-size:12px;opacity:.85}
.money .big{font-family:var(--display);font-size:32px;line-height:1.05;font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mgrid div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;min-width:0}

.money .note{font-size:11.5px;opacity:.85;margin:0}
.neg{color:#ffd0dc}
.bins{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.bin{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 8px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:2px;border-left:5px solid var(--c)}

.bin .d{display:none}
.c-re{--c:var(--re);--cs:var(--re-soft)} .c-watch{--c:var(--watch);--cs:var(--watch-soft)}
.c-sale{--c:var(--sale);--cs:var(--sale-soft)} .c-retail{--c:var(--retail);--cs:var(--retail-soft)} .c-early{--c:var(--early);--cs:var(--early-soft)}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}

.search{position:relative}
.search input{padding-left:36px}

.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.name{font-weight:700;font-size:15.5px;min-width:0}

.found{overflow:hidden}
.phrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.pthumb{width:56px;height:56px;object-fit:cover;border-radius:8px}
.pthumb.big{width:96px;height:96px}
.qe{display:block;width:100%;text-align:left;border:0;background:none;padding:0;color:inherit;font:inherit;cursor:pointer;border-radius:8px}
.qe:active{background:var(--accent-soft)}
.qe .nums+.bar,.qe .bar+.ref{margin-top:8px}
.qehint{display:block;font-size:11.5px;color:var(--accent);font-weight:600;margin-top:4px}
.btn.sl{background:var(--sale-soft);color:var(--sale)}
.btn.wa{background:#1fa855;color:#fff}
.tool.trial{border-color:var(--sale);color:var(--sale)}.tool.pro{border-color:var(--re);color:var(--re)}.tool.free{border-color:var(--retail);color:var(--retail)}
.plgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.plgrid>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.plgrid ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}.plgrid .pro{border-color:var(--re);background:var(--re-soft)}.plprice{margin:8px 0 0;font-weight:800;font-size:16px}
.adrow{display:flex;flex-direction:column;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.adrow .w{display:flex;flex-direction:column;gap:2px}.adrow .pill{align-self:flex-start}
.adbtn{display:flex;gap:6px;flex-wrap:wrap}#ad-q{margin-bottom:4px}
.err.info{color:var(--re);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:6px}
.tool{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;font-weight:600;white-space:nowrap}
.tool b{font-variant-numeric:tabular-nums}.tool.over{border-color:var(--retail);color:var(--retail)}
.resz{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:700;color:var(--re)}
.sz.plus{background:var(--re-soft);color:var(--re);border-color:var(--re)}
.dsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dsum div{background:var(--accent-soft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.dsum .lbl{font-size:12px;color:var(--muted)}.dsum b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.dsum .over{background:var(--retail-soft);color:var(--retail)}
.dlist{display:flex;flex-direction:column;gap:6px}
.drow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-left:5px solid var(--sale);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:left;font:inherit}
.drow.over{border-left-color:var(--retail)}.drow .w{flex:1;display:flex;flex-direction:column;min-width:0}.drow .amt{font-variant-numeric:tabular-nums}.drow.over .amt{color:var(--retail)}
.lbn{width:76px;flex:none;text-align:center}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
#printArea{display:none}
body.staff #moneyd,body.staff .money2,body.staff .costinfo,body.staff #rulesBtn,body.staff button[data-edit],body.staff .own{display:none!important}
@media print{body>*:not(#printArea){display:none!important}body{background:#fff!important;padding:0!important}
 #printArea{display:grid!important;grid-template-columns:repeat(4,1fr);gap:3mm}
 .plabel{border:1px dashed #999;padding:2.5mm;display:flex;flex-direction:column;align-items:center;gap:1mm;break-inside:avoid;color:#000;font-family:Arial,sans-serif;text-align:center}
 .plabel img{width:26mm;height:26mm;image-rendering:pixelated}.plabel b{font-size:15pt;line-height:1}.plabel span{font-size:8pt}
 @page{margin:8mm}}
.decl{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);line-height:1.45}
.decl input{width:auto;margin-top:2px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:0}
.moneyd{border-radius:14px;background:var(--accent);color:var(--surface)}

.histd>summary{cursor:pointer;font-family:var(--display);font-size:19px;padding:4px 0}

.vseg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

.tile{border:1px solid var(--line);border-top:4px solid var(--c);background:var(--surface);border-radius:12px;overflow:hidden;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;min-width:0}

.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}

.acts{display:flex;gap:8px;flex-wrap:wrap}

.hist{display:flex;flex-direction:column;gap:8px}

  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

function daysSince(d){if(!d)return 999;return Math.max(0,Math.floor((Date.now()-new Date(d+'T12:00:00').getTime())/864e5))}
// sizes: each product can keep 입고/판매 per size in it.sz = {P:{m,s}, M:{m,s}, ...}
const SZ=()=>{if(typeof rules==='undefined')return ['P','M','G','GG','U'];if(rules.noSizes)return [];const c=Array.isArray(rules.sizes)?rules.sizes.filter(Boolean):[];return c.length?c:(bt()==='clothes'?['P','M','G','GG','U']:[])};
// U = tamanho único (one size)
const szLabel=k=>k==='U'?(lang==='pt'?'Único':'프리(U)'):k;
const szKeys=it=>{const ks=[...SZ()];for(const k of Object.keys((it&&it.sz)||{}))if(!ks.includes(k))ks.push(k);return ks};
const szSum=(o,f)=>Object.values(o||{}).reduce((a,v)=>a+Math.max(0,+(f?(v||{})[f]:v)||0),0);
function addSz(base,delta,field,sign){const out=JSON.parse(JSON.stringify(base||{}));for(const [k,n] of Object.entries(delta||{})){const q=Math.max(0,Math.floor(+n||0));if(!q)continue;out[k]=out[k]||{m:0,s:0};out[k][field]=Math.max(0,(+out[k][field]||0)+sign*q)}return out}
function calc(it){
  const made=+it.made||0, sold=Math.min(+it.sold||0,made), adj=Math.round(+it.adj||0), stock=Math.max(0,made-sold+adj), rate=made?sold/made*100:0, days=daysSince(it.madeDate);
  const price=+it.price||0, priceV=+it.priceV||0, cost=+it.cost||0, soldV=Math.min(+it.soldV||0,sold), soldA=sold-soldV;
  let cat; if(!made)cat='early'; else if(rate>=rules.reRate)cat='re'; else if(days<rules.minDays)cat='early'; else if(rate>=rules.lowRate)cat='watch'; else cat=stock>rules.retailMax?'sale':'retail';
  const sales=soldA*price+soldV*(priceV||price);
  const sz=it.sz||{},szList=szKeys(it).map(k=>{const v=sz[k]||{};const m=+v.m||0,s=+v.s||0;return {k,m,s,st:Math.max(0,m-s)}}),szM=szSum(sz,'m'),szS=szSum(sz,'s');
  const hasSz=szM>0||szS>0,szUn=Math.max(0,(made-sold)-(szM-szS));
  return {made,sold,soldV,soldA,stock,rate,days,cat,price,priceV,cost,perDay:sold/Math.max(days,1),sales,profit:cost?sales-sold*cost:null,prodCost:made*cost,szList,hasSz,szUn};
}
function advice(j){const L=t();
  if(!j.made)return L.adWait;
  if(j.cat==='re'){const need=Math.max(0,Math.round(j.perDay*30-j.stock));const qn=Math.max(need,Math.round(j.made*0.5/6)*6);return L.adRe(j.perDay.toFixed(1),qn)}
  if(j.cat==='watch')return L.adWatch(j.rate.toFixed(0));
  if(j.cat==='sale'){const sp=j.price*(1-rules.saleOff/100);let s=L.adSale(j.stock,j.price?[brl(j.price),brl(sp)]:null,rules.saleOff);if(j.price&&j.cost&&sp<j.cost)s+=L.belowCost(brl(j.cost));return s}
  if(j.cat==='retail')return L.adRetail(j.stock);
  return L.adEarly(j.days,rules.minDays);
}
function monthsList(){const s=new Set(items.map(i=>i.month).filter(Boolean));s.add(month);const d=new Date();d.setDate(1);for(let k=0;k<13;k++){s.add(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);d.setMonth(d.getMonth()-1)}return [...s].sort().reverse()}

async function makeThumb(file){const bmp=await createImageBitmap(file);let side=360,q=0.72,url='';
  for(let k=0;k<4;k++){const sc=Math.min(1,side/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<70000)break;side=Math.round(side*0.8);q=Math.max(0.5,q-0.08)}
  bmp.close&&bmp.close();return url}

  // changing 입고/판매 moves the stock along; typing the stock yourself keeps your number
  const readSz=()=>{const o={};document.querySelectorAll('.sztbl [data-szm]').forEach(inp=>{const k=inp.dataset.szm,sv=document.querySelector(`.sztbl [data-szs="${CSS.escape(k)}"]`);const m=Math.max(0,Math.floor(+inp.value||0)),so=Math.max(0,Math.floor(+(sv&&sv.value)||0));if(m||so)o[k]={m,s:so}});return o};

    const M=szSum(o,'m'),S=szSum(o,'s');if(M>(+$('#qe-made').value||0))$('#qe-made').value=M;if(S>(+$('#qe-sold').value||0))$('#qe-sold').value=S;sync&&sync();

async function saveItem(id,data){

async function patchItem(id,patch){

async function undoMove(m){const L=t();

function stopScan(){if(scan){scan.on=false;try{scan.stream&&scan.stream.getTracks().forEach(x=>x.stop())}catch(e){}scan=null}}
async function scanForm(){const L=t();stopScan();
  openSheet(`${head(L.scTitle)}<p class="hint">${L.scHint}</p><div class="scanbox"><video id="sc-v" playsinline muted autoplay></video><span class="scanframe"></span></div>
  <p class="err" id="sc-err" hidden></p><div id="sc-list" class="dlist"></div>
  <div class="two"><button class="btn full" type="button" id="sc-sale">${L.scSale}</button><button class="btn soft full" type="button" id="sc-in">${L.scIn}</button></div>`);
  const tally={},order=[];
  const draw=()=>{const el=$('#sc-list');if(!el)return;el.innerHTML=order.length?order.map(c=>{const it=codeMatches(c)[0];return `<div class="hrow"><div class="w"><b><span class="code">${esc(c)}</span> × ${tally[c]}</b><span class="ref">${it?esc(dn(it)):L.scUnknown}</span></div><button class="btn soft sm" type="button" data-scm="${esc(c)}">−1</button></div>`}).join(''):`<p class="hint">${L.scEmpty}</p>`};
  const bump=c=>{if(!tally[c]){tally[c]=0;order.unshift(c)}tally[c]++;draw();try{navigator.vibrate&&navigator.vibrate(60)}catch(_){}toast(L.scGot(c))};
  draw();window.__scanAdd=bump;
  $('#sc-list').onclick=e=>{const b=e.target.closest('[data-scm]');if(!b)return;const c=b.dataset.scm;tally[c]--;if(tally[c]<=0){delete tally[c];order.splice(order.indexOf(c),1)}draw()};
  const go=type=>{if(!order.length)return toast(L.scEmpty);
    const lines=order.slice().reverse().map(c=>{const it=codeMatches(c)[0];return {code:c,pick:it?it.id:'new',type:it?type:'in',qty:tally[c]}});
    stopScan();inputForm(lines[0],lines.slice(1))};
  $('#sc-sale').onclick=()=>go('sale');$('#sc-in').onclick=()=>go('in');
  const fail=()=>{const e=$('#sc-err');if(e){e.textContent=L.scNoCam;e.hidden=false}};
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})}catch(e){return fail()}
  const v=$('#sc-v');if(!v){stream.getTracks().forEach(x=>x.stop());return}
  const me={on:true,stream};scan=me;v.srcObject=stream;try{await v.play()}catch(_){}
  let det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(_){}}
  if(!det){try{await loadLib('jsqr',()=>window.jsQR)}catch(_){return fail()}}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});let last='',seen=0;
  const tick=async()=>{if(scan!==me||!me.on)return;let code='';
    try{if(v.readyState>=2&&v.videoWidth){if(det){const r=await det.detect(v);if(r[0])code=r[0].rawValue}
      else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)code=r.data}}}catch(_){}
    code=String(code||'').trim().slice(0,40);
    // count a label once while it stays in view; move away and back to count it again
    if(code){if(code!==last||Date.now()-seen>900)bump(code);last=code;seen=Date.now()}
    setTimeout(tick,150)};
  tick()}

function planOf(d,td){td=td||todayStr();if(!d)return {kind:'pro',days:0,until:'',open:true};
  if(d.plan==='pro'&&(!d.until||d.until>=td))return {kind:'pro',days:0,until:d.until||''};

  return {kind:'free',days:0,until:''}}

    suSave: '저장하고 시작하기', suLocal: 'Firebase 없이 이 휴대폰에서만 써보기', suLocalHint: '설정 없이 바로 써볼 수 있어요. 내용은 이 휴대폰에만 저장되고, 영수증 AI 읽기는 Firebase 설정 후에 쓸 수 있어요.',
    suErr: '설정을 읽지 못했어요. apiKey, projectId, appId가 들어 있는지 확인해 주세요.', setup: '앱 설정', local: '이 휴대폰에만 저장 중' },
  pt: { title: 'Controle de Estoque', sub: 'Entre com sua conta Google para guardar seus produtos com segurança.', btn: 'Entrar com Google', out: 'Sair', err: 'Não foi possível entrar. Tente de novo.',
    suSub: 'Configure só uma vez. Cole a configuração copiada do Firebase.', suCfgL: 'Configuração do Firebase (cole todo o const firebaseConfig = { ... })', suKeyL: 'Chave de segurança (ID da chave reCAPTCHA, opcional)',
    suSave: 'Salvar e começar', suLocal: 'Usar só neste celular, sem Firebase', suLocalHint: 'Dá para testar sem configurar. Os dados ficam só neste celular e a leitura de notas por IA funciona depois de configurar o Firebase.',
    suErr: 'Não consegui ler a configuração. Confira se tem apiKey, projectId e appId.', setup: 'Configurar app', local: 'Salvando só neste celular' }
};
let user = null, localMode = false;
const ls = { get: k => { try { return localStorage.getItem(k) } catch (e) { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} }, del: k => { try { localStorage.removeItem(k) } catch (e) {} } };
const lg = () => LG[document.documentElement.lang === 'ko' ? 'ko' : 'pt'];
App.onRender = () => { const L = lg();
  $('#lgTitle').textContent = L.title; $('#lgSub').textContent = L.sub; $('#loginTxt').textContent = L.btn;
  $('#logoutBtn').textContent = L.out; $('#whoName').textContent = user ? (user.email || '') : (localMode ? L.local : '');
  $('#setupBtn').textContent = L.setup; $('#logoutBtn').hidden = !user;
  $('#suCfgL').textContent = L.suCfgL; $('#suKeyL').textContent = L.suKeyL; $('#suSave').textContent = L.suSave; $('#suLocal').textContent = L.suLocal; $('#suLocalHint').textContent = L.suLocalHint;
  if (!$('#setup').hidden) $('#lgSub').textContent = L.suSub; };
App.render();

const valid = c => c && c.apiKey && !String(c.apiKey).startsWith('PASTE') && c.projectId && c.appId;
let cfg = window.FIREBASE_CONFIG || {};
if (!valid(cfg)) { try { cfg = JSON.parse(ls.get('fbcfg') || '{}'); } catch (e) { cfg = {}; } }
const loginBox = $('#login'), err = $('#lgErr');
$('#setupBtn').onclick = () => { ls.del('fbcfg'); ls.del('localMode'); location.reload(); };
function parseCfg(text) {
  const o = {}; const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g; let m;
  while ((m = re.exec(text))) o[m[1]] = m[2];
  if (o.projectId && !o.authDomain) o.authDomain = o.projectId + '.firebaseapp.com';
  return o;
}
function localDb() {
  let store = {}; try { store = JSON.parse(ls.get('jaego-local') || '{}'); } catch (e) {}
  const subs = new Set(); const save = () => ls.set('jaego-local', JSON.stringify(store));
  const fire = () => subs.forEach(f => f()); let seq = 0;
  const kids = p => Object.keys(store).filter(k => k.startsWith(p + '/') && k.split('/').length === p.split('/').length + 1)
    .map(k => ({ id: k.split('/').pop(), data: () => JSON.parse(JSON.stringify(store[k])) }));
  const q = (p, ord, lim) => ({ onSnapshot(n) { const f = () => { let d = kids(p); if (ord) d.sort((a, b) => String(b.data()[ord]).localeCompare(String(a.data()[ord]))); if (lim) d = d.slice(0, lim); n({ docs: d }); }; subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    limit(n) { return q(p, ord, n); } });
  const dref = path => ({ id: path.split('/').pop(),
    async set(d) { store[path] = JSON.parse(JSON.stringify(d)); save(); fire(); },
    async update(d) { if (!store[path]) throw new Error('missing'); Object.assign(store[path], JSON.parse(JSON.stringify(d))); save(); fire(); },
    async delete() { delete store[path]; save(); fire(); },
    onSnapshot(n) { const f = () => n({ exists: !!store[path], data: () => store[path] }); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); } });
  return { collection: p => Object.assign(q(p), { orderBy: f => q(p, f), doc: id => dref(p + '/' + (id || ('l' + Date.now().toString(36) + (seq++)))) }), doc: dref };
}
if (!valid(cfg) && ls.get('localMode') === '1') {
  localMode = true; App.attach(localDb()); App.setState('ok');
} else if (!valid(cfg)) {
  loginBox.hidden = false; $('#loginBtn').hidden = true; $('#setup').hidden = false; App.render();
  $('#suSave').onclick = () => { const o = parseCfg($('#cfgText').value); const k = $('#cfgKey').value.trim(); if (k) o.appCheckSiteKey = k;
    if (!valid(o)) { $('#suErr').textContent = lg().suErr; $('#suErr').hidden = false; return; }
    ls.set('fbcfg', JSON.stringify(o)); ls.del('localMode'); location.reload(); };
  $('#suLocal').onclick = () => { ls.set('localMode', '1'); location.reload(); };
} else {
  const app = initializeApp(cfg);
  const siteKey = cfg.appCheckSiteKey;
  if (siteKey && !String(siteKey).startsWith('PASTE')) {
    try { initializeAppCheck(app, { provider: new ReCaptchaEnterpriseProvider(siteKey), isTokenAutoRefreshEnabled: true }); } catch (e) { console.warn('App Check', e); }
  }
  const fs = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  const auth = getAuth(app);

  // --- storage adapter (same shape the shared page code expects) ---
  const w = p => navigator.onLine ? Promise.race([p, new Promise(r => setTimeout(r, 4000))]) : (p.catch(() => {}), Promise.resolve());
  const docRef = r => ({ id: r.id, set: d => w(setDoc(r, d)), update: d => w(updateDoc(r, d)), delete: () => w(deleteDoc(r)),
    onSnapshot: (n, e) => onSnapshot(r, s => n({ exists: s.exists(), data: () => s.data() }), e) });
  const qRef = q => ({ onSnapshot: (n, e) => onSnapshot(q, s => n({ docs: s.docs.map(d => ({ id: d.id, data: () => d.data() })) }), e) });
  const colRef = c => Object.assign(qRef(c), {
    doc: id => docRef(id ? doc(c, id) : doc(c)),
    orderBy: (f, dir) => Object.assign(qRef(query(c, orderBy(f, dir))), { limit: n => qRef(query(c, orderBy(f, dir), limit(n))) })
  });
  const makeDb = uid => ({ collection: p => colRef(collection(fs, `users/${uid}/${p}`)), doc: p => docRef(doc(fs, `users/${uid}/${p}`)) });

  // --- AI: Gemini through Firebase AI Logic ---
  try {
    const ai = getAI(app, { backend: new GoogleAIBackend() });
    // each model has its own free daily quota: if one is used up (or busy), try the next
    const names = [...new Set([cfg.aiModel || 'gemini-3.8-flash', 'gemini-3.8-flash', 'gemini-3.5-flash', 'gemini-3.5-flash-lite', 'gemini-3.1-flash-lite', 'gemini-2.5-flash-lite'])];
    const models = names.map(n => getGenerativeModel(ai, { model: n, generationConfig: { responseMimeType: 'application/json', temperature: 0.1 } }));
    const soft = e => /429|quota|exhausted|rate|503|unavailable|overloaded|404|not found|500|internal|deadline/i.test(String((e && (e.message || e.code)) || ''));
    const b64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
    App.setAi(async (prompt, imgs) => {
      const parts = [{ text: prompt }];
      for (const b of imgs || []) parts.push({ inlineData: { data: await b64(b), mimeType: b.type || 'image/jpeg' } });
      let r, last;
      for (const m of models) {
        try { r = await m.generateContent(parts); break; }
        catch (e) { last = e; if (!soft(e)) throw e; }
      }
      if (!r) { const q = new Error(String((last && last.message) || 'quota')); q.code = /429|quota|exhausted/i.test(q.message) ? 'quota' : 'busy'; throw q; }
      const txt = r.response.text().trim().replace(/^```(?:json)?\s*/i, '').replace(/```$/, '');
      return JSON.parse(txt);
    }, { images: { maxCount: 4 } });
  } catch (e) { console.warn('AI', e); }

  // --- sign-in ---
  const provider = new GoogleAuthProvider();
  $('#loginBtn').onclick = async () => { err.hidden = true;
    try { await signInWithPopup(auth, provider); }
    catch (e) {
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment', 'auth/cancelled-popup-request'].includes(e.code)) {
        try { await signInWithRedirect(auth, provider); } catch (e2) { err.textContent = lg().err; err.hidden = false; }
      } else if (e.code !== 'auth/popup-closed-by-user') { err.textContent = lg().err; err.hidden = false; }
    } };
  getRedirectResult(auth).catch(() => {});
  $('#logoutBtn').onclick = () => signOut(auth);
  // --- staff: an owner lists a Gmail; that person then works on the owner's data ---
  const em = u => String(u.email || '').toLowerCase();
  App.team = {
    add: async e => { await setDoc(doc(fs, `staffOf/${e}`), { owner: user.uid, ownerName: user.displayName || user.email || '', at: new Date().toISOString() });
      await setDoc(doc(fs, `users/${user.uid}/team/${e}`), { email: e, at: new Date().toISOString() }); },
    remove: async e => { await deleteDoc(doc(fs, `users/${user.uid}/team/${e}`)); await deleteDoc(doc(fs, `staffOf/${e}`)).catch(() => {}); }
  };
  // --- plans: 14-day trial on first sign-in; the app owner turns paid months on in the admin screen ---
  App.contact = { wa: cfg.contactWhatsApp || '', price: cfg.priceText || '' };
  let planUnsub = null, adminUnsub = null;
  const ts = v => v && typeof v.toDate === 'function' ? v.toDate().toISOString() : (v || '');
  async function watchPlan(u, mode) {
    if (planUnsub) { planUnsub(); planUnsub = null; } if (adminUnsub) { adminUnsub(); adminUnsub = null; }
    App.me = { uid: u.uid, email: u.email || '' }; App.admin = null;
    const isAdmin = cfg.adminUid && u.uid === cfg.adminUid;
    if (isAdmin) {   // the owner always has everything and sees the admin list
      App.setPlan(null);
      App.admin = { list: [], onChange: null,
        set: (uid, data) => updateDoc(doc(fs, `plans/${uid}`), data) };
      adminUnsub = onSnapshot(collection(fs, 'plans'), s => {
        App.admin.list = s.docs.map(d => ({ uid: d.id, ...d.data(), trialStart: ts(d.data().trialStart), created: ts(d.data().trialStart) }));
        if (App.admin.onChange) App.admin.onChange(); App.render(); }, () => {});
      return;
    }
    const pid = mode && mode.role === 'staff' ? mode.owner : u.uid, ref = doc(fs, `plans/${pid}`);
    if (!(mode && mode.role === 'staff')) {
      try { const s = await getDoc(ref);
        if (!s.exists()) await setDoc(ref, { plan: 'trial', trialStart: serverTimestamp(), email: u.email || '', name: u.displayName || '' });
      } catch (e) { App.setPlan(null); return; }   // rules not updated yet: keep everything open
    }
    planUnsub = onSnapshot(ref, s => { const ok = s && typeof s.exists === 'function' && s.exists(); App.setPlan(ok ? { ...s.data(), trialStart: ts(s.data().trialStart) } : null); }, () => App.setPlan(null));
  }
  onAuthStateChanged(auth, async u => {
    user = u;
    if (!u) { App.detach(); if (planUnsub) { planUnsub(); planUnsub = null; } if (adminUnsub) { adminUnsub(); adminUnsub = null; } App.admin = null; loginBox.hidden = false; App.setState('wait'); return; }
    loginBox.hidden = true;
    let mode = null; const key = 'staffMode-' + u.uid;
    try { const s = await getDoc(doc(fs, `staffOf/${em(u)}`));
      if (s.exists() && s.data().owner && s.data().owner !== u.uid) mode = { role: 'staff', owner: s.data().owner, ownerName: s.data().ownerName || '' };
      if (mode) ls.set(key, JSON.stringify(mode)); else ls.del(key);
    } catch (e) { try { mode = JSON.parse(ls.get(key) || 'null'); } catch (_) {} }
    if (user !== u) return;
    App.attach(makeDb(mode ? mode.owner : u.uid), mode || { role: 'owner' }); App.setState(navigator.onLine ? 'wait' : 'off');
    watchPlan(u, mode);
  });
  addEventListener('offline', () => user && App.setState('off'));
  addEventListener('online', () => user && App.setState('ok'));
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
